services:
  - type: web
    name: acuityvoice
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: ASSEMBLYAI_API_KEY
        sync: false
      - key: MOCK_MODE
        value: "false"
      - key: MAX_SESSION_SECONDS
        value: "180"
