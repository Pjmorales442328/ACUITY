# Pings the free Render instance so it never spins down (free plans sleep after 15 idle minutes).
# ponytail: GitHub schedules on new workflows can go hours without firing, so each run loops for ~6h, then re-dispatches itself.
name: keep-warm
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
concurrency: keep-warm
permissions:
  actions: write
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - run: for i in $(seq 70); do curl -fsS --retry 3 --max-time 60 https://acuityvoice.onrender.com/api/health || echo "ping failed"; echo; sleep 300; done
      - run: gh workflow run keep-warm.yml -R "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
